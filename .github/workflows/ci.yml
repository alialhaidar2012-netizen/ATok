name: Node.js CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: check code
        uses: actions/checkout@v4

      - name: make node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install firebase
        run: npm install

      - name: test firebase
        run: npm test
